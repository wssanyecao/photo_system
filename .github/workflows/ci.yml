name: Quality checks

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression tests
        run: python -m pytest tests/ -q
      - name: Confirm a release tag is reachable from main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Check release tag matches the application version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from photo_gateway import __version__
          actual = os.environ["RELEASE_TAG"]
          expected = f"v{__version__}"
          if actual != expected:
              raise SystemExit(f"Tag mismatch: expected {expected}, got {actual}")
          print(f"Version verified: {actual}")
          PY
