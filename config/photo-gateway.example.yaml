# Photo Gateway 配置示例。
# 复制到一个未纳入版本控制的配置文件，并根据部署环境修改。
# auth.enabled=false 仅用于可信内网试运行；不要将未认证的服务暴露公网。

version: 1

server:
  host: 0.0.0.0
  port: 8080

auth:
  enabled: false            # 本示例未提供真实口令哈希；启用认证需生成 password_hash
  # username: admin
  # password_hash: "scrypt$..."   # 由 `python -m photo_gateway hash-password` 生成
  session_ttl_hours: 24

devices:
  # 推荐：把每台用于上传照片的设备登记成一项（id 为设备标识，name 仅用于展示）。
  # 按你实际设备替换下面示例即可；id 用于识别“照片来自哪台设备”。
  - id: phone
    name: 手机
    enabled: true
  - id: camera
    name: 相机
    enabled: true

storage:
  root: /srv/photo-gateway/storage  # 修改为已存在、具有写权限的数据目录
  incoming: incoming
  processing: processing
  failed: failed
  archive: Photos
  database: database/photo-gateway.db
  logs: logs

upload:
  concurrency: 1
  precheck:
    batch_size: 5
  allowed_extensions:
    - jpg
    - jpeg
    - png
    - heic
    - heif
    - webp
    - tif
    - tiff
    - cr2
    - cr3
    - nef
    - arw
    - dng
    - raf
    - orf
    - rw2
    # 视频（可上传/归档并同步到 NAS；网页内可用首帧预览与播放）
    - mp4
    - mov
    - m4v
    - 3gp
    - webm
    - mkv
    - avi
  tmp_cleanup:
    enabled: true
    max_age_days: 7

processing:
  worker_count: 1

metadata:
  date_priority:
    - DateTimeOriginal
    - CreateDate
    - ModifyDate
    - file_mtime

disk:
  warning_percent: 80
  critical_percent: 90
  stop_percent: 95

logging:
  level: INFO
  rotation:
    max_size_mb: 50
    retention_days: 30

# WebUI 偏好(可选)：照片页每页显示张数(默认 12)
webui:
  photos_page_size: 12

# 缩略图缓存(可选)：cache_dir 相对 storage.root（默认 thumbnails）；
# cleanup 过期清理默认开启、90 天(mtime)，由 serve 维护任务周期执行(启动一轮 + 每 24h)
thumbnails:
  cache_dir: thumbnails
  cleanup:
    enabled: true
    max_age_days: 90

# V2 NAS 同步（可选；启用时建议显式配置 known_hosts 并校验 NAS host key 指纹）
# sync:
#   enabled: false
#   nas:
#     host: nas.example.local
#     ssh_port: 22
#     ssh_user: photo-sync
#     ssh_key: /home/photo-gateway/.ssh/nas_key
#     known_hosts: /home/photo-gateway/.ssh/known_hosts
#     target_root: /data/Photos

# 仅运行主机本地回收站（不影响 NAS）
recycle_bin:
  enabled: true
  retention_days: 30
  auto_purge: true
