name: photo-system

services:
  photo-gateway:
    # 开发机构建环境为 macOS/ARM64，docker-host 运行环境固定为 Linux/x86_64。
    platform: linux/amd64
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        APP_UID: ${PHOTO_UID:-1000}
        APP_GID: ${PHOTO_GID:-1000}
    image: photo-system:${PHOTO_IMAGE_TAG:-stable}
    container_name: photo-system
    user: "${PHOTO_UID:-1000}:${PHOTO_GID:-1000}"
    init: true
    restart: unless-stopped
    stop_grace_period: 11m
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${PHOTO_BIND_IP:-0.0.0.0}:${PHOTO_PORT:-18080}:18080"
    volumes:
      - type: bind
        source: ${PHOTO_STORAGE_ROOT:-/data/compose/photo-system/storage}
        target: /data/photo-system/storage
        bind:
          create_host_path: false
      - type: bind
        source: ${PHOTO_CONFIG_PATH:-/data/compose/photo-system/config/config.yaml}
        target: /etc/photo-gateway/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PHOTO_NAS_KEY_PATH:-/data/compose/photo-system/secrets/nas_key}
        target: /home/photo-gateway/.ssh/nas_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PHOTO_KNOWN_HOSTS_PATH:-/data/compose/photo-system/secrets/known_hosts}
        target: /home/photo-gateway/.ssh/known_hosts
        read_only: true
        bind:
          create_host_path: false
